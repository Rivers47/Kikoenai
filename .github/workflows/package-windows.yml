name: Package Windows single-exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest
    name: Build Windows single-exe (pkg)
    env:
      # Tag-triggered builds name the zip after the tag (vX.Y.Z -> X.Y.Z), the
      # source of truth for releases; backend/package.json may lag behind tags.
      # workflow_dispatch (no tag) leaves this empty -> packager falls back to
      # backend/package.json's version.
      PACKAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Full install (dev + prod) -- needed to build the frontend (Quasar toolchain).
      # Node 24 LTS (Krypton).
      - name: Install dependencies
        run: npm ci

      # scripts/pkg-package.js: builds frontend (prod), prunes dev deps, stages
      # the sqlite3 binding at pkg's first-candidate path, builds ONE Kikoenai.exe
      # via @yao-pkg/pkg (Node 24 win-x64 base), then stages it beside standalone
      # ffmpeg/ffprobe + the launcher bat + data dirs, and zips it.
      - name: Package Windows single-exe
        run: npm run package:windows

      - name: Upload staged folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kikoenai-windows-x64
          path: package/windows-exe/Kikoenai
          if-no-files-found: error
          retention-days: 30

      # Attach the zip to a GitHub release when building from a tag.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: package/dist/Kikoenai-exe-windows-x64-*.zip
          # Publish straight away; notes are generated from commits since the last tag.
          draft: false
          generate_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}