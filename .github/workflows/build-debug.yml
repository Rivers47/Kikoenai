name: Build Debug Container (manual)

# Manual only. The debug image ships an unminified bundle with source maps and
# is never built automatically -- run this from the Actions tab on whichever
# branch or tag you want to debug.
on:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v7

      # ── Frontend ──────────────────────────────────────────────
      - name: Use Node.js for frontend
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci -w frontend

      - name: Build frontend (debug)
        run: npm run build
        working-directory: frontend

      # ── Container image ───────────────────────────────────────
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false is load-bearing: the default (latest=auto) emits an
          # unsuffixed `latest` whenever type=semver matches, and the per-entry
          # suffix below does NOT apply to it -- so a debug run on a tag would
          # publish the debug image as `latest`.
          flavor: latest=false
          tags: |
            type=ref,event=branch,suffix=-debug
            type=sha,prefix={{branch}}-,suffix=-debug,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}},suffix=-debug
            type=raw,value=latest-debug,enable={{is_default_branch}}

      - name: Build container image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          context: ./
          containerfiles: |
            ./Containerfile
          oci: true

      - name: Push image to GitHub Container Registry
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
