name: Build All (Frontend + Backend Container)

on:
  push:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v7

      # ── Frontend ──────────────────────────────────────────────
      - name: Use Node.js for frontend
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci -w frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Verify frontend artifact landed in backend/dist/
        run: ls -la backend/dist/

      # ── Container image ───────────────────────────────────────
      - name: Generate container image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build container image using Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          context: ./
          containerfiles: |
            ./Containerfile
          oci: true

      - name: Push to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
