name: Build All (Frontend + Backend Container)

on:
  push:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v7

      # ── Frontend ──────────────────────────────────────────────
      - name: Use Node.js for frontend
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci -w frontend

      - name: Build frontend (production, no debug)
        run: npm run build:prod
        working-directory: frontend

      # ── Container image ───────────────────────────────────────
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false: only the explicit type=raw entry below may set `latest`.
          # The default (latest=auto) would emit an extra unsuffixed `latest` on
          # semver tag pushes -- see build-debug.yml, where that clobbered it.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Lowercase the image name and tags
        id: names
        run: |
          echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS_EOF'
            echo "${{ steps.meta.outputs.tags }}" | tr '[:upper:]' '[:lower:]'
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build container image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ steps.names.outputs.image }}
          tags: ${{ steps.names.outputs.tags }}
          context: ./
          containerfiles: |
            ./Containerfile
          oci: true

      - name: Push image to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.names.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
