name: Build All (Frontend + Backend Container)

on:
  push:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v7

      # ── Frontend ──────────────────────────────────────────────
      - name: Use Node.js for frontend
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci -w frontend

      - name: Build frontend (production, no debug)
        run: npm run build:prod
        working-directory: frontend

      - name: Save production build
        run: cp -r backend/dist backend/dist-prod

      - name: Build frontend (debug)
        run: npm run build
        working-directory: frontend

      - name: Save debug build
        run: cp -r backend/dist backend/dist-debug

      # ── Container image metadata ──────────────────────────────
      - name: Generate production image metadata
        id: meta-prod
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate debug image metadata
        id: meta-debug
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-debug
            type=ref,event=pr,suffix=-debug
            type=sha,prefix={{branch}}-,suffix=-debug,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=semver,pattern={{version}},suffix=-debug
            type=raw,value=latest-debug,enable={{is_default_branch}}

      # ── Production image ──────────────────────────────────────
      - name: Stage production build for image
        run: rm -rf backend/dist && cp -r backend/dist-prod backend/dist

      - name: Build production container image
        id: build-image-prod
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta-prod.outputs.tags }}
          context: ./
          containerfiles: |
            ./Containerfile
          oci: true

      - name: Push production image to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image-prod.outputs.image }}
          tags: ${{ steps.meta-prod.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Debug image ──────────────────────────────────────────
      - name: Stage debug build for image
        run: rm -rf backend/dist && cp -r backend/dist-debug backend/dist

      - name: Build debug container image
        id: build-image-debug
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta-debug.outputs.tags }}
          context: ./
          containerfiles: |
            ./Containerfile
          oci: true

      - name: Push debug image to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image-debug.outputs.image }}
          tags: ${{ steps.meta-debug.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}